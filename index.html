<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VILL'AGE JEUNES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>

        .login-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2.5vh;
        }

        .btn-login {
            width: 100%;
            padding: 18px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            text-align: center;
        }

        .btn-login-primary {
            background-color: #649d50;
            color: #F7F7F7;
        }

        .btn-login-primary:hover {
            background-color: #89c75b;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(100, 157, 80, 0.3);
        }

        .btn-login-secondary {
            background-color: #F7F7F7;
            border: 2px solid #f08d35;
            color: #1e1e1d;
        }

        .btn-login-secondary:hover {
            background-color: #f08d35;
            color: #F7F7F7;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(240, 141, 53, 0.3);
        }

        .btn-login-pointage {
            background-color: #F7F7F7;
            border: 2px solid #1f658e;
            color: #1e1e1d;
        }

        .btn-login-pointage:hover {
            background-color: #1f658e;
            color: #F7F7F7;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(31, 101, 142, 0.3);
        }

        .separator {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 1.9vh;
            margin: 1.27vh 0;
        }

        .separator-line {
            flex: 1;
            height: 1px;
            background-color: #6e6f75;
        }

        .separator-text {
            color: #6e6f75;
            font-size: 14px;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background-color: #F7F7F7;
            padding: 10vh 3.75vw;
        }

        .login-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10vh;
            flex: 1;
            justify-content: center;
        }

        /* Media queries pour responsive */
        @media (min-width: 769px) {
            /* Desktop - s'adapte depuis mobile */
            body {
                padding: 10vh 3.25vw;
            }
        }

        @media (max-width: 768px) {
            /* Tablette */
            body {
                padding: 10vh 5vw;
            }

            .login-container {
                max-width: 90%;
            }
        }

        @media (max-width: 480px) {
            /* Mobile - base mobile-first */
            body {
                padding: 10vh 3.75vw;
            }

            .login-container {
                max-width: 100%;
            }

            .btn-login {
                font-size: 1rem;
                padding: 1rem 1.125rem;
            }
        }

        /* Widget Pointage */
        .pointage-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .pointage-overlay.active {
            display: flex;
        }

        .pointage-widget {
            background: #F7F7F7;
            border-radius: 10px;
            padding: 1.5rem 2rem;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .pointage-close {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            width: 32px;
            height: 32px;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pointage-close svg {
            width: 24px;
            height: 24px;
        }

        .pointage-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e1e1d;
            margin-bottom: 1.5rem;
            padding-right: 2rem;
        }

        .pointage-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .pointage-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .pointage-group label {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1e1e1d;
        }

        .pointage-input,
        .pointage-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #7d7d7d;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            background: rgba(240, 240, 240, 0.5);
            color: #1e1e1d;
            box-sizing: border-box;
        }

        .pointage-input:focus,
        .pointage-select:focus {
            outline: none;
            border-color: #1f658e;
        }

        .pointage-validate {
            margin-top: 0.5rem;
            padding: 14px 20px;
            background: #1f658e;
            color: #F7F7F7;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pointage-validate:hover {
            background: #2a7ba3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(31, 101, 142, 0.3);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo -->
        <div class="logo-container" style="cursor: pointer;" onclick="window.location.href='index.html'">
            <img src="logo et charte graphique/LogoRond.svg" alt="VILL'AGE JEUNES" class="logo-svg" onerror="this.src='logo et charte graphique/LogoRond.png';">
            <div class="logo" style="display: none;">
                <span class="logo-text">VILL'AGE<br>JEUNES</span>
            </div>
        </div>

        <!-- Boutons de connexion/inscription -->
        <div class="login-buttons">
            <button class="btn-login btn-login-primary" onclick="window.location.href='connexion.html'">
                Je me connecte
            </button>

            <button class="btn-login btn-login-pointage" id="btnPointage">
                Pointage
            </button>

            <div class="separator">
                <div class="separator-line"></div>
                <span class="separator-text">ou</span>
                <div class="separator-line"></div>
            </div>

            <button class="btn-login btn-login-secondary" onclick="window.location.href='inscription-complete.html'">
                Je m'inscris
            </button>
        </div>

        <!-- Widget Pointage Adhérent -->
        <div class="pointage-overlay" id="pointageAdherentOverlay">
            <div class="pointage-widget">
                <button type="button" class="pointage-close" id="pointageAdherentClose">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 9L9 15M9 9L15 15" stroke="#6e6f75" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <h2 class="pointage-title">Pointage</h2>
                <div class="pointage-form">
                    <div class="pointage-group">
                        <label for="pointageIdentifiant">Identifiant</label>
                        <input type="text" id="pointageIdentifiant" class="pointage-input" placeholder="Identifiant">
                    </div>
                    <div class="pointage-group">
                        <label for="pointageMotdepasse">Mot de passe</label>
                        <input type="password" id="pointageMotdepasse" class="pointage-input" placeholder="Mot de passe">
                    </div>
                    <div class="pointage-group">
                        <label for="pointageActivite">Ce que je viens faire</label>
                        <select id="pointageActivite" class="pointage-select">
                            <option value="">Sélectionner une activité</option>
                            <option value="chill">Chill</option>
                            <option value="participer">Participer à une activité</option>
                            <option value="travailler">Travailler</option>
                            <option value="imprimer">Imprimer un CV ou autre papier</option>
                            <option value="s_informer">Venir s'informer</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                    <button type="button" class="pointage-validate" id="pointageAdherentValidate">Valider</button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <a href="#" class="footer-link">Politique de confidentialité</a>
            <span class="footer-separator">|</span>
            <a href="#" class="footer-link">Mentions légales</a>
        </footer>
    </div>

    <script>
        (function() {
            const overlay = document.getElementById('pointageAdherentOverlay');
            const btnPointage = document.getElementById('btnPointage');
            const closeBtn = document.getElementById('pointageAdherentClose');
            const validateBtn = document.getElementById('pointageAdherentValidate');
            const identifiantInput = document.getElementById('pointageIdentifiant');
            const motdepasseInput = document.getElementById('pointageMotdepasse');
            const activiteSelect = document.getElementById('pointageActivite');

            const activiteLabels = {
                chill: 'Chill',
                participer: 'Participer à une activité',
                travailler: 'Travailler',
                imprimer: 'Imprimer un CV ou autre papier',
                s_informer: "Venir s'informer",
                autre: 'Autre'
            };

            function openPointageWidget() {
                if (overlay) {
                    overlay.classList.add('active');
                    if (identifiantInput) identifiantInput.value = '';
                    if (motdepasseInput) motdepasseInput.value = '';
                    if (activiteSelect) activiteSelect.value = '';
                    if (identifiantInput) identifiantInput.focus();
                }
            }

            function closePointageWidget() {
                if (overlay) overlay.classList.remove('active');
            }

            if (btnPointage) btnPointage.addEventListener('click', openPointageWidget);
            if (closeBtn) closeBtn.addEventListener('click', closePointageWidget);
            if (overlay) {
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) closePointageWidget();
                });
            }
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && overlay?.classList.contains('active')) {
                    closePointageWidget();
                }
            });

            [identifiantInput, motdepasseInput, activiteSelect].filter(Boolean).forEach(function(el) {
                el.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') validateBtn?.click();
                });
            });

            if (validateBtn) {
                validateBtn.addEventListener('click', function() {
                    const identifiant = identifiantInput?.value?.trim();
                    const motdepasse = motdepasseInput?.value || '';
                    const activiteValue = activiteSelect?.value;

                    if (!identifiant || !motdepasse || !activiteValue) {
                        alert('Veuillez remplir l\'identifiant, le mot de passe et sélectionner une activité.');
                        return;
                    }

                    var payload = {
                        date: new Date().toISOString().slice(0, 10),
                        identifiant: identifiant,
                        activite: activiteLabels[activiteValue] || activiteValue
                    };
                    console.log('Pointage adhérent:', payload);
                    alert('Pointage enregistré avec succès.');
                    closePointageWidget();
                });
            }
        })();
    </script>
</body>
</html>
