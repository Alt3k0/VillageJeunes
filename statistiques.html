    <link rel="stylesheet" href="style_staff.css">

<body>
    <!-- Fond décoratif -->
    <div class="background-decoration"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-top">
            <div class="header-left">
                <img src="logo et charte graphique/LogoRond.svg" alt="VILL'AGE JEUNES" class="header-logo" onclick="window.location.href='accueil-staff.html'" onerror="this.src='logo et charte graphique/LogoRond.png';">
                <div class="header-menu-container">
                    <div class="header-menu" id="menuToggle">
                        <div class="header-menu-icon">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div class="header-profile" id="profileIconStaff">
                    <svg class="header-profile-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>

    <div class="sidebar-menu" id="sidebarMenu">
        <div class="menu-close" id="menuClose">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
        <nav class="menu-nav">
            <a href="accueil-staff.html" class="menu-item">
                <span>Planning et salles</span>
            </a>

            <a href="informations.html" class="menu-item">
                <span>Informations</span>
            </a>
            <div class="menu-separator"></div>
            <a href="validation-inscription.html" class="menu-item">
                <span>Validation inscription</span>
            </a>
            <div class="menu-separator"></div>
            <a href="statistiques.html" class="menu-item active">
                <span>Statistiques</span>
            </a>
        </nav>
    </div>

    <!-- Overlay pour fermer le menu -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Contenu principal -->
    <main class="main-content">
        <div class="page-title">
            <h1>Statistiques</h1>
            <div class="page-title-underline"></div>
        </div>
        <div style="text-align: center; padding: 3rem 2rem; color: #6e6f75;">
            <p>Les statistiques seront disponibles prochainement.</p>
        </div>
    </main>

    <!-- Widget Profil staff -->
    <div class="profile-overlay" id="profileOverlayStaff" hidden>
        <div class="profile-widget profile-widget-staff">
            <button type="button" class="profile-close" id="closeProfileStaff">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" fill="#d32f2f"/>
                    <path d="M15 9L9 15M9 9L15 15" stroke="#F7F7F7" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <h2 class="profile-title">Mon profil</h2>
            <div class="profile-header">
                <div class="profile-photo" id="profilePhotoStaff">Photo</div>
                <div class="profile-header-info">
                    <div class="profile-name" id="profileDisplayNameStaff">—</div>
                    <div class="profile-number" id="profilePosteStaff">—</div>
                </div>
            </div>
            <div class="profile-section">
                <h3 class="profile-section-title">Informations de contact</h3>
                <div class="profile-info-grid">
                    <div class="profile-info-item full-width">
                        <span class="profile-label">Email :</span>
                        <input type="email" class="profile-input profile-editable" id="profileEmailStaff" placeholder="votre@email.nc">
                    </div>
                    <div class="profile-info-item full-width">
                        <span class="profile-label">Téléphone :</span>
                        <input type="tel" class="profile-input profile-editable" id="profileTelephoneStaff" placeholder="00 00 00">
                    </div>
                </div>
            </div>
            <button type="button" class="profile-save-btn" id="profileSaveBtnStaff">Enregistrer les modifications</button>
        </div>
    </div>

            <a href="https://www.facebook.com/villagejeunes/" target="_blank" rel="noopener noreferrer" class="footer-social-link" aria-label="Facebook Vill'Age Jeunes">
                <svg class="footer-social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>

            <a href="#" class="footer-link">Politique de confidentialité</a>

            <a href="#" class="footer-link">Mentions légales</a>
